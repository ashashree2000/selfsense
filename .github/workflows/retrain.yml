name: Scheduled retraining
on:
  schedule:
    - cron: "17 2 * * 1"   # weekly, Monday 02:17 UTC
  workflow_dispatch:
    inputs:
      as_of:
        description: "Data cut-off date (YYYY-MM-DD). Empty = registry date + 7 days"
        required: false

permissions:
  contents: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r api/requirements.txt pytest httpx
      - name: Generate new days -> pipeline -> quality -> backtest -> promote? -> publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional; brief falls back to template if unset
        run: |
          if [ -n "${{ github.event.inputs.as_of }}" ]; then python -m mlops.retrain --as-of "${{ github.event.inputs.as_of }}";
          else python -m mlops.retrain; fi
      - name: Refresh README results tables from reports/*.json
        run: python -m mlops.update_readme
      - name: Tests against the newly published artifacts
        run: pytest -q tests/test_api.py
      - name: Upload model artifacts (binaries are not committed)
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.run_number }}
          path: models/artifacts/
          retention-days: 90
      - name: Commit published results (triggers Vercel redeploy)
        run: |
          git config user.name "selfsense-bot"
          git config user.email "selfsense-bot@users.noreply.github.com"
          git add app/forecasts.json app/data reports models/registry.json models/artifacts README.md
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "retrain: $(python -c "import json;r=json.load(open('models/registry.json'));print(r['current_as_of'], r['production'])")"
          git push
