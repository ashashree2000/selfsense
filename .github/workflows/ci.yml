name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pipeline, features, metrics, models/no-leakage, quality checks, reorder, API)
        run: pytest -q
      - name: Browser smoke tests (Insights tab, Excel import, integrations disabled)
        run: |
          python -m playwright install --with-deps chromium
          RUN_E2E=1 pytest tests/e2e -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f api/Dockerfile -t selfsense-api:ci .
      - name: Smoke-test container
        run: |
          docker run -d -p 8000:8000 --name api selfsense-api:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/forecast -H 'content-type: application/json' -d '{"product_ids":[1],"horizon":7}'
          docker rm -f api
